version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DB_HOST=db             # ✅ container name, not localhost
      - DB_PORT=3306           # ✅ add this
      - DB_USER=root
      - DB_PASSWORD=kapoor
      - DB_NAME=foodorderingwesitedb

  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: kapoor
      MYSQL_DATABASE: foodorderingwesitedb
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3308:3306"            
